name: Check and publish portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate content and publication gates
        run: npm run validate
      - name: Test claim and evidence guards
        run: npm test
      - name: Build static pages
        run: npm run build
        env:
          BUILD_BASE: /mywebsite/
      - name: Check local links, routes and metadata
        run: npm run check
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  browser:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install isolated browser QA dependencies
        run: npm ci --prefix qa/browser --ignore-scripts --no-audit --no-fund
      - name: Install Chromium for loopback-only verification
        run: qa/browser/node_modules/.bin/playwright install --with-deps --only-shell chromium
      - name: Verify layouts, keyboard behavior, contact fallbacks and printing
        run: npm run verify --prefix qa/browser
      - name: Save browser verification evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-verification
          path: qa/browser/results/
          if-no-files-found: warn
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static artifact
        id: deployment
        uses: actions/deploy-pages@v4
